name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release configuration
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Build frontend
        run: npm run build

      # Tauri validates every configured bundle resource while compiling its
      # build script, including during clippy and tests. Source verification
      # does not package or execute these files; release builds fetch and
      # verify the real FFmpeg binaries and model before packaging.
      - name: Prepare source-check resource placeholders
        shell: pwsh
        run: |
          $resources = @(
            "src-tauri/bin/ffmpeg.exe",
            "src-tauri/bin/ffprobe.exe",
            "src-tauri/models/birefnet-general-lite.onnx"
          )

          foreach ($resource in $resources) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $resource) | Out-Null

            if (-not (Test-Path -LiteralPath $resource -PathType Leaf)) {
              New-Item -ItemType File -Path $resource | Out-Null
            }
          }

      - name: Test native application
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
