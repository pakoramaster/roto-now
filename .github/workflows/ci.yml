name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release configuration
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Build frontend
        run: npm run build

      # Tauri validates configured bundle resources while compiling its build
      # script. Source checks need FFmpeg placeholders only; models are never
      # embedded in the installer.
      - name: Prepare source-check resource placeholders
        shell: pwsh
        run: |
          $resources = @(
            "src-tauri/bin/ffmpeg.exe",
            "src-tauri/bin/ffprobe.exe"
          )

          foreach ($resource in $resources) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $resource) | Out-Null

            if (-not (Test-Path -LiteralPath $resource -PathType Leaf)) {
              New-Item -ItemType File -Path $resource | Out-Null
            }
          }

      - name: Test native application
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
