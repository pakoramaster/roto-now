name: Windows release

on:
  push:
    branches:
      - main

concurrency:
  group: windows-main-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch and verify FFmpeg 8.1.2
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Fetch and verify bundled General Lite
        shell: pwsh
        run: ./scripts/fetch-general-lite.ps1

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $version
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify source builds
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Sign installer when certificate secrets are configured
        if: env.WINDOWS_SIGNING_CERTIFICATE != '' && env.WINDOWS_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "roto-now-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$signTool) { throw "SignTool was not found." }
          Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Create or overwrite version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG" --force
          if ($LASTEXITCODE -ne 0) { throw "Could not update release tag $env:RELEASE_TAG." }

          $installers = @(Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $installer.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not overwrite release asset." }
            gh release edit $env:RELEASE_TAG --title "Roto Now $env:RELEASE_VERSION" --prerelease=false
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata." }
          } else {
            gh release create $env:RELEASE_TAG $installer.FullName --verify-tag --title "Roto Now $env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release." }
          }
