name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-main-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release configuration
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Fetch and verify FFmpeg 8.1.2
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Fetch and verify bundled General Lite
        shell: pwsh
        run: ./scripts/fetch-general-lite.ps1

      - name: Verify pinned bundle assets
        shell: pwsh
        run: ./scripts/verify-release.ps1 -RequireBundleAssets

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify source builds
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Prepare optional signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $hasCertificate = ![string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure both WINDOWS_SIGNING_CERTIFICATE and WINDOWS_SIGNING_PASSWORD, or neither."
          }
          if ($hasCertificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "roto-now-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
            "WINDOWS_SIGNING_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
            "WINDOWS_SIGNING_PASSWORD=$env:SIGNING_PASSWORD" >> $env:GITHUB_ENV
            "configured=true" >> $env:GITHUB_OUTPUT
          } else {
            "configured=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          ./scripts/test-installer.ps1 -InstallerPath $installers[0].FullName

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$signTool) { throw "SignTool was not found." }
          $targets = @(
            Get-Item "src-tauri\target\x86_64-pc-windows-msvc\release\roto-now.exe"
            Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe"
          )
          foreach ($target in $targets) {
            & $signTool.FullName verify /pa /all $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($target.Name)." }
          }

      - name: Remove temporary signing certificate
        if: always() && steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:WINDOWS_SIGNING_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          "WINDOWS_SIGNING_CERTIFICATE_PATH=" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_PASSWORD=" >> $env:GITHUB_ENV

      - name: Publish version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remoteTag = git ls-remote origin "refs/tags/$env:RELEASE_TAG"
          if ($remoteTag) {
            $tagCommit = ($remoteTag -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $env:RELEASE_TAG already points to another commit. Increment the app version before releasing."
            }
          } else {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $env:RELEASE_TAG." }
          }

          $installers = @(Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          $checksumPath = "$($installer.FullName).sha256"
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $installer.FullName $checksumPath --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not overwrite release asset." }
            gh release edit $env:RELEASE_TAG --title "Roto Now $env:RELEASE_VERSION" --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata." }
          } else {
            gh release create $env:RELEASE_TAG $installer.FullName $checksumPath --verify-tag --title "Roto Now $env:RELEASE_VERSION" --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create release." }
          }
