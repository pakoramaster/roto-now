[package]
name = "roto-now"
version = "0.1.1"
description = "Local AI-assisted rotoscoping for images and video"
authors = ["Roto Now"]
edition = "2021"

[lib]
name = "roto_now_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "copy-dylibs", "directml", "download-binaries", "ndarray", "std", "tls-rustls", "tracing"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
