[package]
name = "roto-now"
version = "0.1.0"
description = "Local AI-assisted rotoscoping for images and video"
authors = ["Roto Now"]
edition = "2021"

[lib]
name = "roto_now_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
